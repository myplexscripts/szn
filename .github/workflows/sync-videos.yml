name: Sync videos
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-videos
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and merge RSS feed
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          from datetime import datetime, timezone

          feed = 'https://www.youtube.com/feeds/videos.xml?channel_id=UCAwcolgWYbKI8sCr9-dJQ0g'
          ns = {'atom': 'http://www.w3.org/2005/Atom', 'yt': 'http://www.youtube.com/xml/schemas/2015'}
          with urllib.request.urlopen(feed, timeout=30) as response:
              root = ET.fromstring(response.read())
          if root.tag != '{http://www.w3.org/2005/Atom}feed':
              raise ValueError('Unexpected RSS response')
          with open('videos.json', encoding='utf-8') as f:
              archive = {video['id']: video for video in json.load(f)}
          def scheduled_start(video_id):
              # Public watch-page metadata; best effort, no API key.
              try:
                  request = urllib.request.Request(
                      f'https://www.youtube.com/watch?v={video_id}',
                      headers={'User-Agent': 'Mozilla/5.0', 'Accept-Language': 'en-US,en;q=0.9'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      html = response.read().decode('utf-8', errors='replace')
                  match = re.search(r'ytInitialPlayerResponse\s*=\s*', html)
                  if not match:
                      return None
                  player, _ = json.JSONDecoder().raw_decode(html[match.end():])
                  details = player.get('microformat', {}).get('playerMicroformatRenderer', {}).get('liveBroadcastDetails', {})
                  if details.get('startTimestamp'):
                      return details['startTimestamp']
                  upcoming = player.get('playabilityStatus', {}).get('liveStreamability', {}).get('liveStreamabilityRenderer', {}).get('offlineSlate', {}).get('liveStreamOfflineSlateRenderer', {})
                  if upcoming.get('scheduledStartTime'):
                      return datetime.fromtimestamp(int(upcoming['scheduledStartTime']), timezone.utc).isoformat()
              except Exception as error:
                  print(f'Schedule unavailable for {video_id}: {error}')
              return None

          for entry in root.findall('atom:entry', ns):
              id = entry.findtext('yt:videoId', namespaces=ns)
              title = entry.findtext('atom:title', namespaces=ns)
              published = entry.findtext('atom:published', namespaces=ns)
              if not all((id, title, published)):
                  continue
              previous = archive.get(id, {})
              archive[id] = {'id': id, 'title': title, 'published': published,
                             'thumb': f'https://i.ytimg.com/vi/{id}/hqdefault.jpg',
                             'url': f'https://www.youtube.com/watch?v={id}'}
              if previous.get('scheduled'):
                  archive[id]['scheduled'] = previous['scheduled']
              scheduled = scheduled_start(id)
              if scheduled:
                  archive[id]['scheduled'] = scheduled
          videos = sorted(archive.values(), key=lambda v: v['published'], reverse=True)
          with open('videos.json', 'w', encoding='utf-8') as f:
              json.dump(videos, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- videos.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json
          git commit -m 'Sync YouTube video archive'
          git push origin main
