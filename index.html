<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>@suzanneraider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101015;--panel:#1a1921;--line:#302d39;--text:#f5f3fa;--muted:#aaa7b7;--accent:#ed75ca;--blue:#7782ff;font-family:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}a{color:inherit}button,input{font:inherit}button,a,input{outline-offset:4px}:focus-visible{outline:2px solid var(--blue)}.wrap{width:min(1440px,calc(100% - 64px));margin:auto}
header{border-bottom:1px solid var(--line);padding:32px 0}.header-row,.brand,.links{display:flex;align-items:center;gap:16px}.header-row{justify-content:space-between;flex-wrap:wrap}.brand img{width:64px;height:64px;object-fit:cover;border-radius:50%}h1{font-size:clamp(1.35rem,3vw,2rem);letter-spacing:-.045em;margin:0;font-weight:700}.links{gap:10px;flex-wrap:wrap}.link{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;font-size:.9rem;font-weight:600}.link svg{width:18px;height:18px}.channel{color:#a6adff}.book{color:#f49ad8}
main{padding:32px 0 64px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}h2{font-size:1.35rem;letter-spacing:-.035em;margin:0 0 4px}.count{color:var(--muted);font-size:.88rem}.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0 13px;width:min(100%,340px)}.search svg{width:18px;flex-shrink:0;color:var(--muted)}.search input{border:0;background:transparent;color:var(--text);width:100%;padding:12px 0;outline:none}.search:focus-within{border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:28px 20px}.video{display:block;align-self:start;text-align:left;padding:0;border:0;background:none;color:var(--text);cursor:pointer;min-width:0}.thumbnail{aspect-ratio:16/9;position:relative;background:var(--panel);overflow:hidden;border-radius:10px}.thumbnail img{width:100%;height:100%;object-fit:cover;display:block}.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#101015df;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;opacity:0;pointer-events:none}.video:hover .play,.video:focus-visible .play{opacity:1}.play svg{width:25px;height:25px}.info{padding:11px 1px 0}.info h3{font-size:1rem;font-weight:600;line-height:1.45;margin:0 0 6px;overflow-wrap:anywhere}.info time{color:var(--muted);font-size:.85rem}.upcoming{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:.85rem;font-weight:600}.upcoming svg{width:15px;height:15px}.state{padding:60px 20px;text-align:center;color:var(--muted);line-height:1.6}.state[hidden]{display:none}footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.82rem}
dialog{width:min(960px,calc(100% - 32px));max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0}dialog::backdrop{background:#000b}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;gap:15px}.modal-head h2{font-size:1rem;margin:0;overflow-wrap:anywhere}.close{border:0;background:transparent;color:var(--text);width:36px;height:36px;cursor:pointer;flex-shrink:0;display:grid;place-items:center}.close svg{width:22px}.player{aspect-ratio:16/9;background:#000}.player iframe{display:block;width:100%;height:100%;border:0}.modal-foot{padding:16px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}.modal-foot a{color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:7px}.modal-foot svg{width:16px;height:16px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:600px){.wrap{width:calc(100% - 32px)}header{padding:24px 0}.brand img{width:52px;height:52px}.search{width:100%}.grid{gap:24px}.links{gap:8px}}
</style>
</head>
<body>
<header><div class="wrap header-row"><div class="brand"><img src="https://yt3.googleusercontent.com/-K2RJtKqltxyylZH0G2vU1rMAa6Ao82Kvl8K90TaZUpLswdRwWU5x87ceAaIqXgUukRMsKXf=s500-c-k-c0x00ffffff-no-rj" alt="" width="64" height="64"><h1>@suzanneraider</h1></div><nav class="links" aria-label="Channel links"><a class="link channel" href="https://www.youtube.com/@suzanneraider" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="4"/><path d="m10 9 5 3-5 3z"/></svg> YouTube</a><a class="link book" href="https://www.amazon.co.uk/dp/B0HH8LR6ZQ" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Buried Deep <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M21 3l-9 9"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a></nav></div></header>
<main class="wrap"><div class="toolbar"><div><h2>Recent videos</h2><div class="count" id="count" role="status" aria-live="polite">Loading archive…</div></div><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span class="sr">Search videos by title</span><input id="search" type="search" placeholder="Search videos…" disabled></label></div><div id="state" class="state" role="status">Loading videos…</div><div id="grid" class="grid"></div></main>
<footer><div class="wrap">An independent fan archive. Videos are hosted by YouTube and belong to their respective owners.</div></footer>
<dialog id="dialog" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="close" id="close" aria-label="Close video" autofocus><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 6-12 12M6 6l12 12"/></svg></button></div><div class="player"><iframe id="player" title="YouTube video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="modal-foot"><span id="modal-schedule" class="upcoming"></span><a id="watch" target="_blank" rel="noopener noreferrer">Watch on YouTube <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M21 3l-9 9"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), grid=$('grid'), state=$('state'), search=$('search'), count=$('count'), dialog=$('dialog'), player=$('player');
let videos=[], opener=null;
const dateFormat=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'});
const scheduleFormat=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});
function upcoming(v){const date=new Date(v.scheduled);return Number.isFinite(date.getTime())&&date.getTime()>Date.now()?date:null;}
function scheduleLabel(v){const date=upcoming(v);return date?'Upcoming · '+scheduleFormat.format(date):'';}
function render(){
 const query=search.value.trim().toLocaleLowerCase();
 const filtered=videos.filter(v=>v.title.toLocaleLowerCase().includes(query));
 count.textContent=`${videos.length.toLocaleString()} ${videos.length===1?'video':'videos'}`+(query?` · ${filtered.length} matching`:'');
 grid.replaceChildren(); state.hidden=filtered.length>0;
 state.textContent=videos.length===0?'The archive is empty. Videos will appear after the first successful sync.':'No videos match your search.';
 const fragment=document.createDocumentFragment();
 for(const v of filtered){
  const card=document.createElement('button');card.type='button';card.className='video';
  const thumb=document.createElement('div');thumb.className='thumbnail';
  const img=document.createElement('img');img.src=`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;img.alt='';img.loading='lazy';img.decoding='async';
  const play=document.createElement('span');play.className='play';play.setAttribute('aria-hidden','true');play.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14l11-7z"/></svg>';
  thumb.append(img,play);
  const info=document.createElement('div');info.className='info';const title=document.createElement('h3');title.textContent=v.title;const time=document.createElement('time');time.dateTime=v.published;const date=new Date(v.published);time.textContent=Number.isNaN(date.getTime())?'Date unavailable':dateFormat.format(date);info.append(title);const scheduled=upcoming(v);if(scheduled){const badge=document.createElement('span');badge.className='upcoming';badge.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.24 7.76a6 6 0 0 1 0 8.48M7.76 7.76a6 6 0 0 0 0 8.48M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/><circle cx="12" cy="12" r="2"/></svg>';badge.append(document.createTextNode(scheduleLabel(v)));info.append(badge);}else{info.append(time);}card.append(thumb,info);
  card.addEventListener('click',()=>{opener=card;$('modal-schedule').textContent=scheduleLabel(v);$('modal-title').textContent=v.title;$('watch').href=`https://www.youtube.com/watch?v=${v.id}`;player.title=v.title;player.src=`https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1`;dialog.showModal();});fragment.append(card);
 }
 grid.append(fragment);
}
$('close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
dialog.addEventListener('close',()=>{player.removeAttribute('src');if(opener?.isConnected)opener.focus();});
search.addEventListener('input',render);
(async()=>{try{const response=await fetch('./videos.json',{cache:'no-cache'});if(!response.ok)throw Error('Fetch failed');const data=await response.json();if(!Array.isArray(data))throw Error('Invalid archive');videos=data.filter(v=>v&&typeof v.title==='string'&&typeof v.published==='string'&&/^[\w-]{11}$/.test(v.id)).sort((a,b)=>b.published.localeCompare(a.published));search.disabled=false;render();}catch(error){count.textContent='Archive unavailable';state.textContent='Could not load the video archive. Please refresh the page to try again.';console.error(error);}})();
</script>
</body>
</html>
